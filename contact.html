<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unique Form Design</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      overflow: hidden;
    }

    /* --- Navbar Styles --- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
    }

    .logo {
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .nav-links li a {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-links li a:hover {
      color: #00ffd5; /* Matches the glowing circle */
    }
    /* --------------------- */

    .background-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.5;
      animation: float 6s infinite alternate ease-in-out;
    }

    .circle1 {
      width: 250px;
      height: 250px;
      background: #ff4ecd;
      top: 10%;
      left: 10%;
    }

    .circle2 {
      width: 300px;
      height: 300px;
      background: #00ffd5;
      bottom: 10%;
      right: 10%;
    }

    @keyframes float {
      from {
        transform: translateY(0px);
      }
      to {
        transform: translateY(30px);
      }
    }

    .form-container {
      width: 380px;
      padding: 35px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      z-index: 2;
      color: white;
    }

    .form-container h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .input-box {
      margin-bottom: 20px;
      position: relative;
    }

    .input-box input,
    .input-box textarea {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.2);
      color: white;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
    }

    .input-box input::placeholder,
    .input-box textarea::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .input-box input:focus,
    .input-box textarea:focus {
      background: rgba(255,255,255,0.3);
      transform: scale(1.02);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, #ff4ecd, #00ffd5);
      color: #111;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #fff;
    }

    img{
      width: 100px;
      height: 40px;
    }
    /* --- Footer Styles --- */
.footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 15px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255, 255, 255, 0.2);
  z-index: 10;
  color: white;
}

.footer-text {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.8);
}

.footer-links {
  list-style: none;
  display: flex;
  gap: 20px;
}

.footer-links li a {
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  font-size: 14px;
  transition: 0.3s;
}

.footer-links li a:hover {
  color: #ff4ecd; 
}
  </style>
</head>
<body>

  <header class="navbar">
    <img src="logo.png" alt="logo">
    <nav>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>
  <div class="background-circle circle1"></div>
  <div class="background-circle circle2"></div>

  <div class="form-container">
    <h2>Contact Us</h2>

    <form id="myForm">
      <div class="input-box">
        <input type="text" id="name" placeholder="Enter your name" required>
      </div>

      <div class="input-box">
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="input-box">
        <textarea id="message" rows="4" placeholder="Write your message" required></textarea>
      </div>

      <button type="submit" class="submit-btn">Send Message</button>

      <div class="message" id="successMessage"></div>
    </form>
  </div>
  <footer class="footer">
  <div class="footer-text">
    &copy; 2026 MyBrand. All rights reserved.
  </div>
  <ul class="footer-links">
    <li><a href="#">Privacy Policy</a></li>
    <li><a href="#">Terms of Service</a></li>
    <li><a href="#">Twitter</a></li>
  </ul>
</footer>

  <script>
    const form = document.getElementById('myForm');
    const successMessage = document.getElementById('successMessage');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const name = document.getElementById('name').value;

      successMessage.innerHTML = `✨ Thank you, ${name}! Your message has been sent successfully.`;

      form.reset();
    });
  </script>

</body>
</html>
